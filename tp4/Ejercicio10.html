<html>
<head>
    <title>Ejercicio 10 - Libro de Visitas</title>
</head>
<body>
    <h2>Libro de Visitas</h2>
    <form action="procesar_visita.php" method="post">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="pais">País de origen:</label><br>
        <select id="pais" name="pais" required>
            <option value="" disabled selected>seleccione país</option>
            <option value="Argentina">Argentina</option>
            <option value="Chile">Chile</option>
            <option value="España">España</option>
            <option value="México">México</option>
        </select>
        <br><br>

        <label>Valoración del sitio:</label><br>
        <input type="radio" id="malo" name="valoracion" value="malo">
        <label for="malo">Malo</label><br>
        
        <input type="radio" id="regular" name="valoracion" value="regular">
        <label for="regular">Regular</label><br>
        
        <input type="radio" id="bueno" name="valoracion" value="bueno" checked>
        <label for="bueno">Bueno</label><br>
        
        <input type="radio" id="muy_bueno" name="valoracion" value="muy_bueno">
        <label for="muy_bueno">Muy bueno</label><br>
        
        <input type="radio" id="excelente" name="valoracion" value="excelente">
        <label for="excelente">Excelente</label><br><br>

        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="5" cols="40" placeholder="Escriba aquí sus comentarios..."></textarea>
        <br><br>

        <input type="submit" value="Enviar Visita">
    </form>
</body>
</html>
