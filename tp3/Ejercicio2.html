<!DOCTYPE html>
<html>
<head>
<title>Ejercicio2.html - Tabla</title>
</head>
<body>
<h1>Estructura de una tabla</h1>
<table border="5" cellpadding="10" cellspacing="0">
    <tr>
        <td rowspan="2">Celda 1x1 <br> (2 filas)</td>
        <td colspan="2">Celda 1x2-3 (2 columnas)</td>
    </tr>
    <tr>
        <td>Celda 2x2</td>
        <td>Celda 2x3</td>
    </tr>
    <tr>
        <td>Celda 3x1</td>
        <td>Celda 3x2</td>
        <td rowspan="2">Celda 3x3 <br> (2 filas)</td>
        <td>Celda 3x4</td>
        <td>Celda 3x5</td>
    </tr>
    <tr>
        <td>Celda 4x1</td>
        <td>Celda 4x2</td>
        <td>Celda 4x4</td>
        <td>Celda 4x5</td>
    </tr>

        <!-- Fila 5 -->
    <tr>
        <td>Celda 5x1</td>
        <td>Celda 5x2</td>
        <td>Celda 5x3</td>
        <td>Celda 5x4</td>
        <td>Celda 5x5</td>
    </tr>
    <tr>
            <td>Celda 6x1</td>
            <td>Celda 6x2</td>
            <td>Celda 6x3</td>
            <td>Celda 6x4</td>
            <td>Celda 6x5</td>
    </tr>

</table>
</body>
</html>
